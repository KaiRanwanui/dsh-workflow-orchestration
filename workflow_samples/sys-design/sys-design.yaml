# 系统分析与设计作业流（阶段 5 · Iter-46 环境准备初充）
# 12 任务纯串行链：设计准备 → 需求澄清 → … → 设计基线。
# v0.2（Iter-45）：全部任务挂 quality-gate（checker=skills/gate-<id>/SKILL.md，
# on-failure: retry + max-retries 1——FAIL 时 gateNote 反馈重做一轮，耗尽 FAILED 停链）。
# v0.3（Iter-46）：design-init 升级为环境初始化六步（目录/工具/知识库占位/输入件/git 建仓/环境报告），
#   其门禁改 on-failure: block（环境不就绪阻断工作流）；PRD 输入改 prd/PRD.md（工作空间根，
#   外部输入件不再随工作流发布）；知识库目录树 knowledge-base/ 由 design-init 创建。
# v0.4（Iter-46 验收修复）：PRD 从全部 inputs 移除——创建期 preset 语境校验仅锚定模板子目录，
#   工作空间外部输入件不可声明为 inputs（E-INPUT-MISSING）；PRD 存在性由 design-init 运行时
# v0.4（Iter-46 验收修复）：PRD 从全部 inputs 移除——创建期 preset 语境校验仅锚定模板子目录，
#   工作空间外部输入件不可声明为 inputs（E-INPUT-MISSING）；PRD 存在性由 design-init 运行时
#   检查（缺失→判不就绪→门禁 FAIL→block 阻断），下游技能经 00 报告获取 PRD 绝对路径。
# 任务 skill 为初版：LLM 依据 PRD 与上游产物真实开展分析设计（不追求内容质量上限）。
# 技能：两级链（工作空间 → 预定义根）解析。
name: sys-design
version: "0.4"
description: "系统分析与设计作业流（12 任务串行：设计准备→需求澄清→用例分析→功能影响→DFX分析→SR定义→需求评审→功能设计→DFX设计→AR定义→设计评审→设计基线；全任务门禁 v0.4；design-init 环境初始化六步 block）"
tasks:
  - id: design-init
    name: "设计准备"
    processor: skills/sys-design-init/SKILL.md
    outputs: ["output/00-design-init.md"]
    quality-gate:
      checker: skills/gate-design-init/SKILL.md
      on-failure: block

  - id: req-clarify
    name: "需求澄清"
    processor: skills/sys-req-clarify/SKILL.md
    inputs:
      prep: "output/00-design-init.md"
    outputs: ["output/01-req-clarify.md"]
    depends-on: [design-init]
    quality-gate:
      checker: skills/gate-req-clarify/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: uc-analy
    name: "用例分析"
    processor: skills/sys-uc-analy/SKILL.md
    inputs:
      clarify: "output/01-req-clarify.md"
    outputs: ["output/02-uc-analy.md"]
    depends-on: [req-clarify]
    quality-gate:
      checker: skills/gate-uc-analy/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: func-impact
    name: "功能影响分析"
    processor: skills/sys-func-impact/SKILL.md
    inputs:
      ucanaly: "output/02-uc-analy.md"
    outputs: ["output/03-func-impact.md"]
    depends-on: [uc-analy]
    quality-gate:
      checker: skills/gate-func-impact/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: dfx-analy
    name: "DFX 分析"
    processor: skills/sys-dfx-analy/SKILL.md
    inputs:
      impact: "output/03-func-impact.md"
    outputs: ["output/04-dfx-analy.md"]
    depends-on: [func-impact]
    quality-gate:
      checker: skills/gate-dfx-analy/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: sr-def
    name: "SR 定义"
    processor: skills/sys-sr-def/SKILL.md
    inputs:
      impact: "output/03-func-impact.md"
      dfx: "output/04-dfx-analy.md"
    outputs: ["output/05-sr-def.md"]
    depends-on: [func-impact, dfx-analy]
    quality-gate:
      checker: skills/gate-sr-def/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: req-review
    name: "需求评审"
    processor: skills/sys-req-review/SKILL.md
    inputs:
      sr: "output/05-sr-def.md"
    outputs: ["output/06-req-review.md"]
    depends-on: [sr-def]
    quality-gate:
      checker: skills/gate-req-review/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: func-design
    name: "功能设计"
    processor: skills/sys-func-design/SKILL.md
    inputs:
      review: "output/06-req-review.md"
    outputs: ["output/07-func-design.md"]
    depends-on: [req-review]
    quality-gate:
      checker: skills/gate-func-design/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: dfx-design
    name: "DFX 设计"
    processor: skills/sys-dfx-design/SKILL.md
    inputs:
      fdesign: "output/07-func-design.md"
    outputs: ["output/08-dfx-design.md"]
    depends-on: [func-design]
    quality-gate:
      checker: skills/gate-dfx-design/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: ar-def
    name: "AR 定义"
    processor: skills/sys-ar-def/SKILL.md
    inputs:
      fdesign: "output/07-func-design.md"
      dfxd: "output/08-dfx-design.md"
    outputs: ["output/09-ar-def.md"]
    depends-on: [func-design, dfx-design]
    quality-gate:
      checker: skills/gate-ar-def/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: design-review
    name: "设计评审"
    processor: skills/sys-design-review/SKILL.md
    inputs:
      ar: "output/09-ar-def.md"
    outputs: ["output/10-design-review.md"]
    depends-on: [ar-def]
    quality-gate:
      checker: skills/gate-design-review/SKILL.md
      on-failure: retry
      max-retries: 1

  - id: design-baseline
    name: "设计基线"
    processor: skills/sys-design-baseline/SKILL.md
    inputs:
      review: "output/10-design-review.md"
    outputs: ["output/11-design-baseline.md"]
    depends-on: [design-review]
    quality-gate:
      checker: skills/gate-design-baseline/SKILL.md
      on-failure: retry
      max-retries: 1
