# Workflow Agent 插件包 - Bundle Patch（单行双端）
# 一个 npm 包同时承载 Host 插件与 Client 面板：
#   - Host：main → lib/index.js（引擎 + workflow_* 工具 + /wf/* 路由）
#   - Client：dsh.client → lib/client.js（conversation.view DAG 面板）——同一行在
#     浏览器上下文挂载 Client 实现（bundle 注册 id = 包名本身，0.1.5 实证约束）
- insert:
    - id: workflow-host
      name: '@workflow-agent/workflow-host'
