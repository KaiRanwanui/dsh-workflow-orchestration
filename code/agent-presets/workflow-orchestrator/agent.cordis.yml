# workflow-orchestrator agent preset
# 通用工作流编排 Agent：串行执行 + 质量门禁 + 重试。
#
# 两层架构：
# - 编排（本 preset）：Agent Loop 调 subagent 执行 Task/Gate，调
#   workflow_begin/workflow_status 启动与上报（本地插件 ./workflow-host.mjs）。
# - 呈现（Iter-3）：Client 插件展示 DAG（本迭代不包含）。
#
# 服务行必须在 isolate realm 的 group 中；本 preset 不发布新服务（工具与
# prompt section 注册到本 preset 的 standing scope，消费宿主注册表），
# 因此无需 realm。subagent 工具 / fs / skill 均为消费宿主注册表的行。

# ── 身份：编排 persona（阶段 3g 文件化）────────────────────────────────
# system-prompt.md = persona 单一源；本行经 ./persona-file.mjs 运行时读取
# 同目录 system-prompt.md 注册 persona 段（机制对齐官方 dsh-persona 的
# preset 作用域遮蔽）。改提示词只改 system-prompt.md 并重部署（无需重启）。
- id: persona
  name: ./persona-file.mjs
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── subagent 委托（消费宿主 subagents 注册表，无服务发布）───────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

# ── 工作流引擎本地插件（workflow_begin / workflow_status）────────────────
# 已迁移至 desktop profile npm 包 @workflow-agent/workflow-host
# 不再需要 preset 本地挂载 workflow-host.mjs
# - id: workflow-host
#   name: ./workflow-host.mjs

# ── RPC 处理器（已停用 — Iter-5 由 webServer 路由替代）────────────────
# 原 workflow-rpc.mjs 注册 wf:status / wf:skill / wf:config（harness.handle），
# 依赖 harness Builtin（仅动态插件/preset 本地插件可用）。
# Iter-5 起改为 workflow-host npm 包注册 webServer HTTP 路由（/wf/*），
# Client 用 fetch 轮询，不再需要本插件。
# - id: workflow-rpc
#   name: ./workflow-rpc.mjs

# ── 文件与技能工具（消费宿主 fs / skill 注册表）─────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Iter-26(GUI 二轮反馈)：编排 Agent 需要 bash 执行 reset 的 pendingCleanup.cmd
# （fs 服务无删除 API，产物清空由本会话 bash 执行——system-prompt [清理契约]）。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 常规模型工具 ─────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true