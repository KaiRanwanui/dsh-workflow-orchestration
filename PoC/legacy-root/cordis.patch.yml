# software-design-agent profile patch layer
# =============================================================================
# Applied AFTER dsh-base and dsh-web-app bundle layers, BEFORE the agent
# preset mounts. Persona and plan mode belong to the agent preset
# (~/.dsh/.agent-presets/software-design/agent.cordis.yml), not here.
# This file sets cross-cutting profile defaults: which preset to use,
# tool configurations, sandbox policy, and skill discovery.

# ── Default Agent Preset ───────────────────────────────────────────────────

- id: agent-presets
  config:
    default: software-design

# ── Agent Instructions ─────────────────────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── Tool Configurations ────────────────────────────────────────────────────

# Keep web search for design research; increase timeout for thorough searches.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Allow parallel in-progress tasks for design phases.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Tool result pruning: keep enough context for large design documents.
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# ── Sandbox ────────────────────────────────────────────────────────────────

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write